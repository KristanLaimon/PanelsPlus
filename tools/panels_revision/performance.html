<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books performance · Panels revision</title>
<style>
:root{color-scheme:light dark;font:15px system-ui}*{box-sizing:border-box}body{margin:0;background:light-dark(#f4f5f2,#181a1b);color:light-dark(#202421,#eee)}main{max-width:1500px;margin:auto;padding:24px}a{color:inherit}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}h1{margin:0;font-size:clamp(1.5rem,3vw,2.2rem)}p{line-height:1.5}.muted{color:light-dark(#555,#bbb)}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:22px 0}.controls label{display:flex;align-items:center;gap:8px}select,input{font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:18px}.card{display:block;text-decoration:none;background:light-dark(white,#252827);border:1px solid light-dark(#d3d9d4,#48504b);border-radius:10px;overflow:hidden}.card:focus-visible{outline:3px solid #4189e5;outline-offset:3px}.cover{width:100%;aspect-ratio:2/3;object-fit:contain;background:light-dark(#e4e8e3,#303632);display:block}.body{padding:12px}.body h2{font-size:1rem;overflow-wrap:anywhere;margin:0 0 8px}.score{margin:4px 0;font-weight:650}.pass{color:light-dark(#08783e,#76df9d)}.regression{color:light-dark(#b32318,#ff9999)}.unknown{color:light-dark(#7b5900,#ffd175)}.perfect{background:linear-gradient(90deg,#dc3049,#e89200,#138e56,#2981dc,#9c45c9);color:transparent;background-clip:text}.pages{grid-template-columns:repeat(var(--columns,5),minmax(0,1fr))}.page{border:4px solid #18884b}.page.different{border-color:#c43d35}.page .body{padding:8px}.page h2{margin:0}.page img{aspect-ratio:auto;object-fit:contain;width:100%;background:#ddd}.page small{display:block}.status{min-height:24px}@media(max-width:700px){main{padding:16px}.pages{grid-template-columns:repeat(min(var(--columns,5),3),minmax(0,1fr));gap:8px}.body{padding:8px}}@media(max-width:420px){.pages{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script type="module" src="./revision/performance.ts"></script>
</head>
<body><main>
<header><a id="back" href="/">← Reviewer</a><h1 id="title">Books performance</h1></header>
<p id="description" class="muted">Scores are F1 from the saved diagnostic compared with each book's F1 baseline. Run panel tests for all benchmark checks. Covers show the first mapped page.</p>
<div id="controls" class="controls" hidden><label>Algorithm <select id="algorithm"><option value="safe">Safe</option><option value="smart">Smart</option></select></label><label>Pages <select id="filter"><option value="all">All pages</option><option value="different">Differences only</option></select></label><label>Columns <input id="columns" type="range" min="2" max="10" value="5"><output id="columns-value">5</output></label></div>
<p id="status" class="status" role="status">Loading…</p><div id="grid" class="grid"></div>
</main></body></html>
